services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: sewasetu
      POSTGRES_USER: sewasetu
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-dev-only-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sewasetu -d sewasetu"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: ./app
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-local-development-only-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DB_PASSWORD: ${DB_PASSWORD:-local-dev-only-change-me}
      DB_POOL_MAX: ${DB_POOL_MAX:-4}
      SCHEME_DEADLINE: ${SCHEME_DEADLINE:-2027-12-31 23:59}
    depends_on:
      db:
        condition: service_healthy
      smsgw:
        condition: service_started
    volumes:
      - uploads:/var/sewasetu/uploads
      - applogs:/var/log/sewasetu
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  scheduler:
    build: ./app
    command: ["cron", "-f"]
    restart: unless-stopped
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-local-dev-only-change-me}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - applogs:/var/log/sewasetu

  smsgw:
    build: ./smsgw
    restart: unless-stopped
    expose:
      - "8025"

volumes:
  pgdata:
  uploads:
  applogs:
